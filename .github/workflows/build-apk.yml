name: Construire l'application Android

# Se lance a chaque envoi sur la branche principale, et a la demande depuis
# l'onglet « Actions » (bouton « Run workflow »).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Le SDK Android est DEJA installe sur les machines GitHub, licences
      # acceptees. L'action android-actions/setup-android le remplacait par des
      # outils plus recents dont les licences, elles, ne sont pas acceptees :
      # elle posait alors la question « Review licenses (y/N)? » a un serveur
      # ou personne ne repond, et la construction mourait la. On se contente
      # donc du SDK fourni, ce qui supprime la panne et fait gagner du temps.
      - name: Verifier le SDK Android
        run: |
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms" ] && [ ! -d "$ANDROID_HOME/platform-tools" ]; then
            echo "::error::SDK Android introuvable dans $ANDROID_HOME."
            exit 1
          fi
          # Acceptation silencieuse, sans jamais bloquer : si tout est deja
          # accepte, la commande ne fait rien. Le « || true » garantit que
          # cette etape ne peut pas faire echouer la construction.
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdk" ] && yes 2>/dev/null | "$sdk" --licenses >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "SDK Android pret."

      # Le depot ne contient que www/index.html : tout le reste du projet est
      # fabrique ici, pour n'avoir aucun fichier technique a maintenir a la main.
      - name: Preparer les fichiers du projet
        run: |
          cat > package.json <<'FIN'
          {
            "name": "habitudes-atomiques",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.1.2",
              "@capacitor/android": "^6.1.2",
              "@capacitor/cli": "^6.1.2",
              "@capacitor/local-notifications": "^6.1.0",
              "@capacitor/filesystem": "^6.0.1",
              "@capacitor/clipboard": "^6.0.1",
              "@capacitor/share": "^6.0.2"
            }
          }
          FIN
          cat > capacitor.config.json <<'FIN'
          {
            "appId": "fr.chercheur.habitudes2026",
            "appName": "Habitudes Atomiques",
            "webDir": "www",
            "android": { "allowMixedContent": true },
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_icon",
                "iconColor": "#2e7d32"
              }
            }
          }
          FIN
          # index.html est accepte a la racine OU dans www/ : un depot a deux
          # fichiers suffit donc, sans avoir a creer de dossier a la main.
          if [ -f www/index.html ]; then
            echo "index.html trouve dans www/"
          elif [ -f index.html ]; then
            mkdir -p www && cp index.html www/index.html
            echo "index.html trouve a la racine, recopie dans www/"
          else
            echo "::error::index.html est absent : placez-le a la racine du depot ou dans www/."
            exit 1
          fi
          echo "index.html : $(du -h www/index.html | cut -f1)"

      # Une sonnerie par choix propose dans l'application.
      #
      # Pourquoi c'est indispensable : sous Android, le son d'une notification
      # est porte par le CANAL, et un canal ne peut pointer que vers un fichier
      # embarque dans l'application. Les sonneries sont definies dans le code
      # comme des notes d'oscillateur jouees par le navigateur ; sans ces
      # fichiers, un seul son existerait et tous les groupes sonneraient pareil.
      #
      # Les notes ci-dessous sont celles de ALARM_SOUNDS dans le code : ce qu'on
      # entend en choisissant une sonnerie est donc ce qui sonnera reellement.
      - name: Fabriquer les sonneries
        run: |
          cat > sonneries.py <<'FIN'
          import math
          import os
          import struct
          import sys
          import wave

          # 22 050 Hz : la note la plus aigue des sonneries est a 2 093 Hz, tres loin de
          # la limite de Nyquist (11 025 Hz). Doubler le taux doublerait le poids de
          # l'application sans rien apporter a l'oreille.
          TAUX = 22050
          DUREE_CIBLE = 4.0     # s : une alarme doit durer assez pour etre remarquee
          PAUSE = 0.35          # s entre deux repetitions du motif
          CRETE = 0.86          # amplitude finale, volontairement forte

          # [frequence Hz, decalage s, duree s] — copie de ALARM_SOUNDS
          SONNERIES = [
              ("bip", "sine", 3.0, [(880, 0, 0.45), (1760, 0, 0.22, None, 0.3)]),
              ("double", "sine", 3.4, [(1319, 0, 0.1), (1319, 0.14, 0.1), (659, 0.34, 0.35)]),
              ("triple", "square", 4.0, [(988, 0, 0.1), (1175, 0.16, 0.1), (1397, 0.32, 0.16)]),
              ("reveil", "square", 3.0, [(1046, 0, 0.08), (1319, 0.12, 0.08), (1046, 0.24, 0.08), (1319, 0.36, 0.08), (1046, 0.48, 0.08), (1319, 0.6, 0.14)]),
              ("carillon", "sine", 1.5, [(988, 0, 0.9), (784, 0.3, 0.9), (880, 0.6, 0.9), (659, 0.9, 1.6), (1976, 0, 0.5, None, 0.22), (1318, 0.9, 0.9, None, 0.25)]),
              ("cloche", "sine", 0.9, [(523, 0, 2.4), (1046, 0, 1.6, None, 0.6), (1571, 0, 1.0, None, 0.35), (2093, 0, 0.6, None, 0.2), (784, 0.01, 1.8, None, 0.3), (1100, 0, 0.12, "triangle", 0.5)]),
              ("grave", "sine", 0.7, [(110, 0, 3.0), (165, 0, 2.4, None, 0.7), (220, 0.02, 2.0, None, 0.5), (277, 0, 1.4, "triangle", 0.3), (55, 0, 3.0, None, 0.6)]),
              ("montee", "triangle", 3.6, [(392, 0, 0.16), (523, 0.12, 0.16), (659, 0.24, 0.16), (784, 0.36, 0.16), (988, 0.48, 0.16), (1319, 0.6, 0.7)]),
              ("descente", "sine", 2.2, [(1568, 0, 0.3), (1046, 0.22, 0.3), (698, 0.44, 0.3), (466, 0.66, 0.9), (233, 0.66, 1.0, "triangle", 0.45)]),
              ("arpege", "triangle", 4.2, [(523, 0, 0.22), (659, 0.1, 0.22), (784, 0.2, 0.22), (1046, 0.3, 0.22), (784, 0.4, 0.22), (659, 0.5, 0.22), (523, 0.6, 0.6)]),
              ("fanfare", "square", 2.4, [(392, 0, 0.18, None, 0.8), (523, 0.18, 0.12), (659, 0.3, 0.12), (784, 0.42, 0.5), (1046, 0.42, 0.5, None, 0.45), (523, 0.42, 0.5, "triangle", 0.35)]),
              ("doux", "sine", 1.2, [(392, 0, 1.8), (494, 0.25, 1.6), (587, 0.5, 1.5), (784, 0.75, 1.4, None, 0.4)]),
              ("marimba", "triangle", 5.5, [(698, 0, 0.3), (1397, 0, 0.14, None, 0.4), (1046, 0.16, 0.3), (2093, 0.16, 0.12, None, 0.3), (698, 0.34, 0.45)]),
              ("goutte", "sine", 6.0, [(2093, 0, 0.05, None, 0.5), (1568, 0.03, 0.08), (1046, 0.07, 0.12), (659, 0.12, 0.4)]),
              ("sonar", "sine", 1.1, [(1200, 0, 1.0), (1200, 1.3, 1.0, None, 0.45), (600, 0, 1.0, None, 0.25), (600, 1.3, 1.0, None, 0.12)]),
              ("alerte", "sawtooth", 2.0, [(740, 0, 0.18), (587, 0.18, 0.18), (740, 0.36, 0.18), (587, 0.54, 0.18), (740, 0.72, 0.18), (587, 0.9, 0.3), (370, 0, 1.2, "square", 0.25)]),
              ("sirene", "sawtooth", 1.0, [(440, 0, 0.12), (523, 0.1, 0.12), (622, 0.2, 0.12), (740, 0.3, 0.12), (880, 0.4, 0.12), (740, 0.5, 0.12), (622, 0.6, 0.12), (523, 0.7, 0.12), (440, 0.8, 0.3), (220, 0, 1.1, "triangle", 0.3)]),
              ("muet", "sine", 3.2, []),
          ]


          def echantillon(forme, phase):
              """Une periode d'oscillateur, en [-1, 1]. Memes formes que l'API Web Audio."""
              t = phase % 1.0
              if forme == "sine":
                  return math.sin(2 * math.pi * t)
              if forme == "square":
                  return 1.0 if t < 0.5 else -1.0
              if forme == "triangle":
                  return 4 * t - 1 if t < 0.5 else 3 - 4 * t
              if forme == "sawtooth":
                  return 2 * t - 1
              raise ValueError(f"forme d'onde inconnue : {forme}")


          def motif(forme, notes, declin=3.2):
              """Rend le motif une fois, en flottants non normalises.

              Une note peut imposer sa forme d'onde et son volume : c'est ce melange de
              timbres qui rend les sonneries reconnaissables entre elles.
              """
              if not notes:
                  return []
              fin = max(n[1] + n[2] for n in notes)
              n_ech = int((fin + 0.05) * TAUX)
              buf = [0.0] * n_ech
              for note in notes:
                  freq, delai, duree = note[0], note[1], note[2]
                  forme_note = (note[3] if len(note) > 3 and note[3] else forme)
                  vol = note[4] if len(note) > 4 else 1.0
                  i0 = int(delai * TAUX)
                  total = int(duree * TAUX)
                  for i in range(total):
                      idx = i0 + i
                      if idx >= n_ech:
                          break
                      t = i / TAUX
                      # Enveloppe : attaque tres brève puis decroissance exponentielle,
                      # comme la rampe de gain du navigateur.
                      attaque = min(1.0, t / 0.015) if t < 0.015 else 1.0
                      baisse = math.exp(-declin * (t / duree))
                      buf[idx] += echantillon(forme_note, freq * t) * attaque * baisse * vol
              return buf


          def ecrire(nom, buf):
              chemin = f"alarme_{nom}.wav"
              with wave.open(chemin, "wb") as w:
                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(TAUX)
                  w.writeframes(b"".join(struct.pack("<h", v) for v in buf))
              return chemin


          def main():
              dossier = sys.argv[1] if len(sys.argv) > 1 else "."
              os.makedirs(dossier, exist_ok=True)
              os.chdir(dossier)
              for nom, forme, declin, notes in SONNERIES:
                  if not notes:
                      # « Silencieux » : un fichier reellement muet. Il permet de garder
                      # l'importance maximale du canal — donc la vibration et la banniere
                      # sur l'ecran verrouille — sans aucun son.
                      buf = [0] * int(1.0 * TAUX)
                  else:
                      un = motif(forme, notes, declin)
                      crete = max(abs(v) for v in un) or 1.0
                      un = [v / crete for v in un]        # normalise : volume homogene
                      pause = [0.0] * int(PAUSE * TAUX)
                      piste = []
                      while len(piste) / TAUX < DUREE_CIBLE:
                          piste.extend(un)
                          piste.extend(pause)
                      piste = piste[: int(DUREE_CIBLE * TAUX)]
                      buf = [max(-32767, min(32767, int(v * CRETE * 32767))) for v in piste]
                  chemin = ecrire(nom, buf)
                  print(f"  {chemin} — {len(buf) / TAUX:.2f} s")
              print(f"{len(SONNERIES)} sonneries fabriquees.")


          if __name__ == "__main__":
              main()
          FIN
          mkdir -p sons
          python3 sonneries.py sons
          # Garde-fou : une sonnerie manquante donnerait un canal muet.
          n=$(ls sons/alarme_*.wav | wc -l)
          test "$n" -eq 18 || { echo "::error::$n sonneries fabriquees au lieu de 18."; exit 1; }

      # La cle de signature doit rester LA MEME d'une version a l'autre :
      # Android refuse d'installer une mise a jour signee differemment, et il
      # faudrait desinstaller l'application — donc perdre ses donnees.
      - name: Preparer la cle de signature
        id: cle
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore.b64 ]; then
            base64 -d debug.keystore.b64 > ~/.android/debug.keystore
            echo "neuve=non" >> $GITHUB_OUTPUT
            echo "Cle de signature du depot reutilisee : les mises a jour s'installeront par-dessus."
          else
            echo "neuve=oui" >> $GITHUB_OUTPUT
            echo "::warning::debug.keystore.b64 est absent du depot. Une cle neuve est fabriquee."
            echo "::warning::Recuperez le fichier 'cle-de-signature' dans les artefacts et ajoutez-le au depot,"
            echo "::warning::sinon chaque build produira une signature differente et les mises a jour seront refusees."
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            base64 -w0 ~/.android/debug.keystore > debug.keystore.b64
          fi

      - name: Installer les dependances
        run: npm install --no-audit --no-fund

      - name: Fabriquer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      # Un numero de version different a chaque build : sans cela, Android
      # considere l'APK comme identique et n'installe rien.
      - name: Numeroter la version
        run: |
          python3 - <<'FIN'
          import re, sys
          p = "android/app/build.gradle"
          s = open(p).read()
          s, n = re.subn(r"versionCode\s+\d+", "versionCode ${{ github.run_number }}", s, count=1)
          if n != 1:
              sys.exit(f"::error::versionCode introuvable dans {p}")
          open(p, "w").write(s)
          print("versionCode = ${{ github.run_number }}")
          FIN

      # res/raw : seul emplacement ou un canal de notification sait lire un son.
      - name: Embarquer les sonneries
        run: |
          mkdir -p android/app/src/main/res/raw
          cp sons/alarme_*.wav android/app/src/main/res/raw/
          echo "Sonneries embarquees :"
          ls -1 android/app/src/main/res/raw/

      # Sans ces autorisations, Android differe les alarmes au prochain reveil
      # de l'ecran — exactement le symptome « ca ne vibre que quand j'allume ».
      - name: Autoriser les alarmes
        run: |
          python3 - <<'FIN'
          import sys
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = [
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.USE_EXACT_ALARM",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.VIBRATE",
          ]
          ajout = "".join(f'    <uses-permission android:name="{x}" />\n'
                          for x in perms if x not in s)
          if ajout:
              i = s.index("<application")
              s = s[:i] + ajout + s[i:]
              open(p, "w").write(s)
          manque = [x for x in perms if x not in open(p).read()]
          if manque:
              sys.exit("::error::autorisations absentes : " + ", ".join(manque))
          print("Autorisations en place :\n  " + "\n  ".join(perms))
          FIN

      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Apres un redemarrage du telephone, les alarmes doivent etre
      # reposees par le module de notifications. Il declare pour cela un
      # recepteur BOOT_COMPLETED. Si une mise a jour du module le retirait,
      # les rappels disparaitraient apres chaque redemarrage, sans rien
      # signaler : on verifie donc le manifeste fusionne.
      - name: Verifier la survie des alarmes au redemarrage
        run: |
          m=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*merged*' | head -1)
          if [ -z "$m" ]; then
            echo "::warning::manifeste fusionne introuvable, verification ignoree."
            exit 0
          fi
          echo "Manifeste : $m"
          if grep -q "BOOT_COMPLETED" "$m"; then
            echo "Recepteur de redemarrage present : les alarmes seront reposees au demarrage."
          else
            echo "::warning::aucun recepteur BOOT_COMPLETED : les alarmes seront perdues apres un redemarrage du telephone, jusqu'a la prochaine ouverture de l'application."
          fi

      - name: Recapitulatif
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk" || { echo "::error::APK introuvable."; exit 1; }
          echo "### Application construite" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Taille : $(du -h "$apk" | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- Version : ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Sonneries embarquees : $(ls -1 android/app/src/main/res/raw/alarme_*.wav | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Telechargez **HabitudesAtomiques-apk** plus bas sur cette page." >> $GITHUB_STEP_SUMMARY

      - name: Publier l'application
        uses: actions/upload-artifact@v4
        with:
          name: HabitudesAtomiques-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Publie uniquement si la cle a du etre fabriquee : a ajouter au depot.
      - name: Publier la cle de signature neuve
        if: steps.cle.outputs.neuve == 'oui'
        uses: actions/upload-artifact@v4
        with:
          name: cle-de-signature
          path: debug.keystore.b64
          retention-days: 90
