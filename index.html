      :root {
        --bg:#0f1115; --surface:#171a21; --surface-2:#1d212a;
        --ink:#e8ebf0; --muted:#8a92a3; --line:#2a2f3a;
        --accent:#5fd99a; --accent-dim:#2f7a55;
        --break:#e0936b; --break-dim:#8a4f30;
        --danger:#e06a6a;
        --radius:14px; --shadow:0 2px 12px rgba(0,0,0,.35);
      }
      * { box-sizing:border-box; }
      .app { max-width:720px; margin:0 auto; min-height:100vh; background:var(--bg); color:var(--ink);
        font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; padding-bottom:90px; position:relative; }
      h1,h2,h3 { margin:0; font-weight:650; letter-spacing:-.01em; }
      h2 { font-size:1.25rem; } h3 { font-size:.95rem; margin-bottom:.6rem; }

      .content { padding:20px 18px 18px; }
      .day-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
      .day-date { color:var(--muted); font-size:.85rem; }
      .warn { margin:12px 18px 0; padding:10px 14px; border-radius:10px; background:rgba(224,106,106,.12); border:1px solid var(--danger); color:#f0b4b4; font-size:.82rem; }

      .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:16px; box-shadow:var(--shadow); }

      .habit-list { display:flex; flex-direction:column; gap:10px; }
      .habit-card { display:flex; align-items:flex-start; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); }
      .habit-card.is-break { border-left:3px solid var(--break); }
      .habit-card.archived { opacity:.85; }
      .habit-main { flex:1; cursor:pointer; min-width:0; }
      .habit-row1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
      .habit-name { font-weight:600; font-size:1rem; }
      .habit-stats { display:flex; gap:14px; margin-top:8px; flex-wrap:wrap; }
      .stat { font-size:.78rem; color:var(--muted); }
      .stat b { color:var(--ink); font-variant-numeric:tabular-nums; font-size:.9rem; }
      .badge-soft { font-size:.66rem; color:var(--muted); border:1px solid var(--line); padding:1px 6px; border-radius:99px; }
      .badge-break { font-size:.66rem; color:var(--break); border:1px solid var(--break); padding:1px 6px; border-radius:99px; }
      .two-min { margin-top:10px; background:var(--surface-2); border:1px dashed var(--accent-dim); color:var(--accent); font-size:.74rem; padding:6px 10px; border-radius:8px; cursor:pointer; width:100%; text-align:left; }
      .two-min:hover { background:#22302a; }

      .check { flex:0 0 auto; width:34px; height:34px; border-radius:50%; border:2px solid var(--line); background:transparent; color:var(--bg); font-size:1rem; font-weight:800; cursor:pointer; transition:.15s; }
      .check.checked { background:var(--accent); border-color:var(--accent); color:#06281a; }
      .check-break.checked { background:var(--break); border-color:var(--break); color:#3a1c0c; }
      .delete-btn { flex:0 0 auto; background:transparent; border:none; color:var(--muted); font-size:1.1rem; cursor:pointer; padding:4px 6px; border-radius:8px; }
      .delete-btn:hover { color:var(--ink); background:var(--surface-2); }

      .btn-primary { background:var(--accent); color:#06281a; border:none; border-radius:10px; padding:11px 18px; font-weight:650; cursor:pointer; font-size:.92rem; }
      .btn-primary:disabled { opacity:.4; cursor:not-allowed; }
      .btn-ghost { background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px 16px; cursor:pointer; font-size:.9rem; }
      .btn-ghost:hover { background:var(--surface-2); }
      .btn-danger { background:transparent; color:var(--danger); border:1px solid var(--danger); border-radius:10px; padding:10px 16px; cursor:pointer; font-size:.9rem; }
      .small { padding:7px 12px !important; font-size:.8rem !important; }

      .fab { position:fixed; right:max(18px,calc(50% - 360px + 18px)); bottom:96px; width:56px; height:56px; border-radius:50%; border:none; background:var(--accent); color:#06281a; font-size:1.8rem; font-weight:300; cursor:pointer; box-shadow:0 4px 16px rgba(95,217,154,.4); z-index:5; }

      .tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:720px; display:flex; background:var(--surface); border-top:1px solid var(--line); padding:8px 0 calc(8px + env(safe-area-inset-bottom)); z-index:6; }
      .tabbar button { flex:1; background:none; border:none; color:var(--muted); font-size:.66rem; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; padding:4px 2px; }
      .tab-ico { font-size:1.15rem; }
      .tabbar .tab-on { color:var(--accent); }

      .more-menu { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:10; display:flex; align-items:flex-end; justify-content:center; }
      .confirm-box { width:100%; max-width:420px; margin:auto 12px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:var(--shadow); align-self:center; }
      .confirm-box h3 { margin-bottom:8px; }
      .group-habits { border-top:1px solid var(--line); padding-top:14px; margin-top:4px; }
      .group-habits-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
      .gh-list { display:flex; flex-direction:column; gap:6px; }
      .gh-item { display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
      .gh-name { flex:1; font-size:.88rem; cursor:pointer; }
      .gh-name:hover { color:var(--accent); }
      .gh-dur { font-size:.74rem; color:var(--muted); font-variant-numeric:tabular-nums; }
      .gh-del { background:none; border:none; color:var(--muted); cursor:pointer; font-size:1rem; padding:2px 4px; border-radius:6px; }
      .gh-del:hover { color:var(--danger); background:var(--surface); }
      .confirm-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
      .today-schedule + .today-schedule { margin-top:26px; padding-top:20px; border-top:1px solid var(--line); }
      .trash-gauge { padding:14px 16px; margin-bottom:16px; }
      .tg-head { display:flex; align-items:baseline; gap:10px; }
      .tg-pct { font-size:1.35rem; font-weight:700; font-variant-numeric:tabular-nums; }
      .tg-detail { color:var(--muted); font-size:.74rem; flex:1; }

      .lvl-missed { background:var(--surface-2); border:1px solid rgba(224,106,106,.4); }
      .lvl-off { background:#13161c; }
      .cal-legend { display:flex; align-items:center; gap:6px; margin-top:10px; color:var(--muted); font-size:.72rem; }
      .cal-legend .cal-cell { margin-left:10px; }

      /* Taux par groupe : l'en-t\xEAte porte le nom, l'heure de d\xE9but et la
         moyenne du groupe ; les habitudes se lisent en dessous, d\xE9cal\xE9es. */
      .rate-group { margin:14px 0 0; }
      .rate-group:first-of-type { margin-top:6px; }
      .rate-group-head { display:flex; align-items:center; gap:8px; padding-bottom:5px; border-bottom:1px solid var(--line); }
      .rate-group-dot { width:9px; height:9px; border-radius:50%; flex:none; }
      .rate-group-name { font-size:.86rem; font-weight:650; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .rate-group-time { font-size:.72rem; color:var(--muted); font-variant-numeric:tabular-nums; flex:none; }
      .rate-group-val { font-size:.82rem; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; flex:none; }
      .rate-group-val.bon { color:var(--accent); }
      .rate-group-val.faible { color:var(--danger); }
      .rate-group .rate-row { padding-left:17px; }
      .rate-row { display:flex; align-items:center; gap:10px; margin:8px 0; }
      .rate-name { flex:0 0 38%; font-size:.84rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .rate-bar { flex:1; height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
      .rate-fill { height:100%; background:var(--accent); border-radius:99px; }
      .rate-fill.fill-break { background:var(--break); }
      .rate-val { flex:0 0 auto; font-size:.82rem; font-variant-numeric:tabular-nums; color:var(--muted); }
      .rate-val small { font-size:.72rem; opacity:.75; }
      .chart-wrap { margin-top:6px; }

      .planning .timeline { display:flex; flex-direction:column; gap:2px; }
      /* --- Onglets du formulaire de groupe --- */
      .group-tabs { display:flex; gap:4px; margin:0 0 16px; background:var(--surface-2); padding:4px; border-radius:12px; }
      .group-tabs button { flex:1; background:none; border:none; color:var(--muted); font-family:inherit; font-size:.9rem; font-weight:600; padding:10px; border-radius:9px; cursor:pointer; }
      .group-tabs button.gt-on { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.25); }

      /* --- Emploi du temps du jour (redesign) --- */
      .today-schedule { margin-bottom:20px; }
      .sched-title { margin:0 0 12px; font-size:1rem; }
      .sched-group { background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-bottom:12px; overflow:hidden; position:relative; }
      .sched-group::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--gc); }
      .sched-group-head { width:100%; display:flex; align-items:center; gap:12px; padding:13px 14px 13px 18px; background:none; border:none; cursor:pointer; text-align:left; font-family:inherit; }
      .sched-group-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
      .sched-group-info { flex:1; display:flex; flex-direction:column; gap:2px; min-width:0; }
      .sched-group-name { font-size:.98rem; font-weight:650; color:var(--ink); }
      .sched-group-meta { font-size:.76rem; color:var(--muted); font-variant-numeric:tabular-nums; }
      .sched-group-count { font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums; background:var(--surface-2); padding:3px 9px; border-radius:20px; flex-shrink:0; }
      .sched-group-count.all-done { color:var(--gc); font-weight:700; }
      .sched-habits { padding:4px 14px 12px 18px; display:flex; flex-direction:column; gap:2px; }
      /* Ligne d'habitude pens\xE9e pour un \xE9cran de t\xE9l\xE9phone : le nom n'est
         plus tronqu\xE9, il revient \xE0 la ligne ; les caract\xE8res sont plus
         grands ; la ligne est assez haute pour le doigt. */
      .sched-habit { display:flex; align-items:flex-start; gap:10px; padding:6px 0; }
      /* Habitude class\xE9e : la ligne enti\xE8re porte la couleur du classement. */
      .sched-habit.has-classe { background:var(--cl); border-radius:9px;
        padding:7px 9px; margin:1px 0; }
      .sched-habit.has-classe .sched-habit-name,
      .sched-habit.has-classe .sched-habit-time,
      .sched-habit.has-classe .sched-habit-meta,
      .sched-habit.has-classe .meta-duree,
      .sched-habit.has-classe .meta-lieu,
      .sched-habit.has-classe .meta-sep,
      .sched-habit.has-classe .meta-classe { color:var(--cl-ink); }
      /* Le trait du lieu et le survol prennent l'encre, sinon ils
         disparaissent sur le fond color\xE9. */
      .sched-habit.has-classe .meta-lieu::before { background:var(--cl-ink); }
      .sched-habit.has-classe .sched-habit-body:hover .sched-habit-name { color:var(--cl-ink); }
      /* Ray\xE9 mais toujours lisible : on baisse l'opacit\xE9 au lieu de passer
         au gris, qui se noyait dans la couleur. */
      .sched-habit.has-classe.is-done .sched-habit-name,
      .sched-habit.has-classe.is-missed .sched-habit-name { color:var(--cl-ink); opacity:.72; }
      /* Les trois boutons d'\xE9tat gardent EXACTEMENT les m\xEAmes couleurs que
         sur une ligne non color\xE9e : c'est ce qui permet de reconna\xEEtre une
         habitude valid\xE9e d'un \xE9cran \xE0 l'autre. Seul leur cadre s'assombrit,
         pour qu'ils se d\xE9tachent du fond color\xE9. */
      .sched-habit.has-classe .sched-etat { border-color:rgba(0,0,0,.35);
        box-shadow:0 0 0 1px rgba(0,0,0,.18); }
      /* Les marqueurs d'alerte sont rouges : sur un fond rouge ou rose ils
         disparaissaient. Sur une ligne color\xE9e, ils passent en sombre neutre
         et gardent leur forme, donc leur sens. */
      .sched-habit.has-classe .todo-flag,
      .sched-habit.has-classe .miss-flag { background:rgba(0,0,0,.55); color:#fff;
        box-shadow:0 0 0 1px rgba(255,255,255,.25); }
      .sched-check { width:26px; height:26px; border-radius:9px; border:2px solid var(--line); background:var(--surface-2); color:#06281a; font-size:.9rem; font-weight:800; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:transform .08s; }
      .sched-check:active { transform:scale(.88); }
      /* Suivi \xE0 trois \xE9tats : \xAB pas encore r\xE9pondu \xBB, \xAB pas faite \xBB, \xAB faite \xBB.
         Trois petits boutons accol\xE9s, assez larges pour le doigt (32 px de
         haut) mais compacts pour laisser la place au nom de l'habitude. */
      .sched-etat { display:flex; flex:none; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--surface-2); }
      .etat-btn { position:relative; width:30px; height:30px; border:none; border-right:1px solid var(--line); background:none; color:var(--muted); font-family:inherit; font-size:.9rem; font-weight:800; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .08s, background .12s, color .12s; }
      .etat-btn:last-child { border-right:none; }
      .etat-btn:active { transform:scale(.88); }
      .etat-btn.on { color:var(--bg); }
      .etat-vide.on { background:var(--muted); }
      .etat-non.on { background:var(--danger); }
      .etat-fait.on { background:var(--accent); color:#06281a; }
      /* Habitude d\xE9clar\xE9e non faite : la ligne reste lisible, mais s'efface. */
      .sched-habit.is-missed .sched-habit-main { opacity:.6; }
      .sched-habit.is-missed .sched-habit-time { text-decoration:line-through; }
      .sched-habit-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; cursor:pointer; }
      /* Contexte sur UNE ligne de texte, sans cadre ni fond : ce sont les
         bordures et leurs marges qui doublaient la hauteur d'une habitude,
         et r\xE9duisaient d'autant ce qu'on voit de sa journ\xE9e. */
      .sched-habit-meta { display:block; font-size:.76rem; line-height:1.4; color:var(--muted); }
      .meta-sep { margin:0 5px; opacity:.45; }
      .meta-duree { color:var(--ink); font-weight:650; font-variant-numeric:tabular-nums; }
      /* Le lieu garde son rep\xE8re de couleur, r\xE9duit \xE0 un trait de 3 px. */
      .meta-lieu { color:var(--ink); font-weight:650; }
      .meta-lieu::before { content:""; display:inline-block; width:3px; height:.8em;
        background:var(--lieu, var(--accent)); border-radius:2px; margin-right:5px;
        vertical-align:-1px; }
      /* Le classement s'\xE9crit dans sa couleur, en toutes lettres. */
      .meta-classe { font-weight:600; }
      /* Choix du classement : des pastilles cliquables, nom en clair. */
      .cl-choix { display:flex; flex-wrap:wrap; gap:7px; }
      .cl-chip { background:var(--surface-2); border:1px solid var(--line); color:var(--muted);
        border-radius:999px; padding:6px 12px; font-size:.84rem; cursor:pointer; }
      .cl-chip.on { color:#0b0d12; background:var(--cl); border-color:var(--cl); font-weight:650; }
      .cl-chip:not(.on) { border-left:3px solid var(--cl); }
      .multi-list { display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
      .multi-row { display:flex; gap:6px; width:100%; align-items:center; }
      .multi-row input { flex:1; }
      .multi-del { background:none; border:1px solid var(--line); color:var(--muted); font-size:1rem; line-height:1; padding:0 10px; border-radius:8px; cursor:pointer; align-self:stretch; }
      .multi-del:hover { color:var(--danger); border-color:var(--danger); }
      /* Plus de troncature : c'est elle qui masquait la fin des noms. */
      .sched-habit-name { display:block; font-size:.97rem; line-height:1.25; color:var(--ink);
        overflow-wrap:anywhere; word-break:break-word; }
      .sched-habit-time { font-size:.76rem; color:var(--muted); font-variant-numeric:tabular-nums; flex-shrink:0; }
      .sched-habit.is-done .sched-habit-name { color:var(--muted); text-decoration:line-through; }
      .sched-habit-body:hover .sched-habit-name { color:var(--gc); }

      /* --- Saisie de dur\xE9e libre --- */
      .dur-input { display:flex; align-items:center; gap:8px; }
      .dur-input input { width:90px; text-align:center; font-variant-numeric:tabular-nums; }
      .dur-unit { color:var(--muted); font-size:.85rem; }
      .dur-quick { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
      .dur-quick button { background:var(--surface-2); border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:5px 12px; font-size:.8rem; cursor:pointer; font-family:inherit; }
      /* Case \xE0 cocher sur sa ligne, cible large pour le pouce. */
      .case-ligne { display:flex; align-items:center; gap:9px; margin-top:12px;
        font-size:.88rem; color:var(--ink); cursor:pointer; }
      .case-ligne input { width:18px; height:18px; accent-color:var(--accent); flex:none; }
      .dur-quick button.on { background:var(--accent); color:#06281a; border-color:var(--accent); font-weight:700; }

      /* --- R\xE9ordonnancement des habitudes dans un groupe --- */
      .gh-aide { margin:0 0 8px; }
      /* Poign\xE9e de d\xE9placement. \xAB touch-action:none \xBB est l'\xE9l\xE9ment
         d\xE9terminant : sans lui, Android traite le glissement comme un
         d\xE9filement et interrompt le suivi du doigt d\xE8s le premier pixel. */
      .gh-poignee { flex:none; width:30px; height:30px; display:flex; align-items:center;
        justify-content:center; color:var(--muted); font-size:1rem; line-height:1;
        cursor:grab; border-radius:8px; touch-action:none;
        -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
      .gh-poignee:active { cursor:grabbing; background:var(--surface-2); color:var(--accent); }
      /* L'appui maintenu sur la ligne d\xE9clenchait la s\xE9lection de texte
         d'Android, qui confisquait le geste. */
      .gh-item { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
      /* Ligne saisie : elle se d\xE9tache nettement, et les autres s'effacent
         pour qu'on voie o\xF9 elle va se poser. */
      .gh-item { transition:transform .12s, box-shadow .12s, opacity .12s; }
      .gh-prise { transform:scale(1.03); box-shadow:0 6px 18px rgba(0,0,0,.45);
        border-color:var(--accent); position:relative; z-index:2; cursor:grabbing; }
      .gh-autre { opacity:.55; }


      .sc-add { display:flex; gap:8px; margin-bottom:14px; }
      .sc-add input { flex:1; }
      .sc-counts { display:flex; gap:8px; margin-bottom:12px; }
      .sc-chip { font-size:.78rem; padding:3px 10px; border-radius:99px; font-variant-numeric:tabular-nums; }
      .sc-chip.pos { background:rgba(95,217,154,.15); color:var(--accent); }
      .sc-chip.neu { background:var(--surface-2); color:var(--muted); }
      .sc-chip.neg { background:rgba(224,106,106,.15); color:var(--danger); }
      .sc-list { display:flex; flex-direction:column; gap:8px; }
      .sc-item { display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
      .sc-item.r-pos { border-left:3px solid var(--accent); }
      .sc-item.r-neg { border-left:3px solid var(--danger); }
      .sc-label { flex:1; font-size:.88rem; }
      .sc-rate { display:flex; gap:4px; }
      .sc-rate button { width:28px; height:28px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); color:var(--muted); cursor:pointer; font-weight:800; }
      .sc-rate button.on.pos { background:var(--accent); color:#06281a; border-color:var(--accent); }
      .sc-rate button.on.neu { background:var(--muted); color:var(--bg); }
      .sc-rate button.on.neg { background:var(--danger); color:#fff; border-color:var(--danger); }
      .sc-del { color:var(--muted) !important; }

      .review > .field { margin-bottom:14px; }
      /* Revue de la journ\xE9e, rang\xE9e par groupe. */
      .miss-group { margin-top:20px; }
      .miss-group-head { display:flex; align-items:center; gap:8px; margin:0 0 8px; font-size:.88rem; font-weight:650; }
      .miss-group-time { font-size:.72rem; color:var(--muted); font-weight:400; font-variant-numeric:tabular-nums; }
      .miss-group-count { margin-left:auto; font-size:.7rem; font-weight:600; color:var(--danger); background:var(--surface-2); border:1px solid var(--line); border-radius:99px; padding:2px 9px; flex:none; }
      .miss-group .miss-card { margin-bottom:8px; }
      .miss-card { padding:0; overflow:hidden; }
      .miss-head { width:100%; display:flex; align-items:center; gap:10px; background:none; border:none; color:var(--ink); font-family:inherit; font-size:.9rem; padding:14px 16px; cursor:pointer; text-align:left; }
      .miss-name { flex:1; font-weight:600; }
      .miss-count { background:var(--accent); color:var(--bg); font-size:.68rem; font-weight:700; border-radius:99px; min-width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; padding:0 5px; }
      .miss-context { margin:0; padding:0 16px 6px; color:var(--muted); font-size:.74rem; line-height:1.45; }
      .miss-summary { margin:0; padding:0 16px 12px; color:var(--muted); font-size:.76rem; }
      .miss-body { padding:0 16px 16px; }
      .miss-chips { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 16px; }
      .miss-chip { background:var(--surface-2); border:1px solid var(--line); color:var(--muted); border-radius:99px; padding:7px 13px; font-family:inherit; font-size:.78rem; cursor:pointer; }
      .miss-chip:hover { border-color:var(--accent-dim); color:var(--ink); }
      .miss-chip-on { background:var(--accent); border-color:var(--accent); color:var(--bg); font-weight:600; }
      .review-actions { display:flex; flex-direction:column; gap:10px; margin-top:20px; }
      .review-back { background:none; border:none; color:var(--muted); font-family:inherit; font-size:.8rem; padding:0 0 10px; cursor:pointer; }
      .review-back:hover { color:var(--accent); }
      .review-saved { color:var(--accent); margin-top:8px; }
      .review-history { margin-top:24px; }
      .review-item { background:var(--surface); border:1px solid var(--line); border-radius:10px; margin-bottom:8px; font-size:.84rem; overflow:hidden; }
      .review-item-head { width:100%; display:flex; justify-content:space-between; align-items:center; background:none; border:none; color:var(--ink); padding:10px 12px; cursor:pointer; font-family:inherit; font-size:.84rem; }
      .review-toggle { color:var(--muted); font-size:1rem; }
      .review-detail { padding:0 12px 10px; }
      .review-detail p { margin:6px 0 0; line-height:1.5; }
      .review-date { color:var(--muted); font-size:.74rem; }

      .empty { text-align:center; padding:40px 16px; color:var(--muted); display:flex; flex-direction:column; gap:16px; align-items:center; }
      .empty p { line-height:1.5; max-width:340px; }
      .archived-actions { display:flex; flex-direction:column; gap:6px; }

      .plan-scroll { overflow-y:visible; border-radius:var(--radius); margin-top:8px; -webkit-overflow-scrolling:touch; }
      .plan-grid { display:flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--surface); position:relative; user-select:none; -webkit-user-select:none; }
      .plan-times { width:34px; flex:0 0 auto; border-right:1px solid var(--line); position:relative; }
      .plan-corner { border-bottom:1px solid var(--line); }
      .plan-times-body { position:relative; }
      .plan-hlabel { position:absolute; right:4px; font-size:9px; color:var(--muted); transform:translateY(-50%); }
      .plan-daycol { flex:1; min-width:0; border-left:1px solid var(--line); }
      .plan-daycol:first-of-type { border-left:none; }
      .plan-dhead { display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700; color:var(--muted); border-bottom:1px solid var(--line); }
      .plan-dhead.is-today { color:var(--accent); }
      .plan-dbody { position:relative; }
      .plan-hline { position:absolute; left:0; right:0; border-top:1px solid var(--line); opacity:.5; }
      .plan-hline-half { opacity:.22; border-top-style:dashed; }
      .plan-block { -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; position:absolute; left:2px; width:calc(100% - 4px); background:var(--surface-2); border-left:4px solid var(--accent); border-radius:5px; padding:2px 4px; overflow:hidden; cursor:grab; z-index:2; display:flex; flex-direction:column; gap:1px; }
      .plan-block:active { cursor:grabbing; }
      .plan-block.done { border-left-color:var(--accent); background:rgba(95,217,154,.18); }
      .de-block.dragging { box-shadow:0 4px 14px rgba(0,0,0,.45); outline:2px solid #fff; outline-offset:1px; z-index:5; }
      .review-item-head.static { display:flex; align-items:center; gap:9px; padding:10px 12px; }
      .rv-count { background:var(--surface-2); color:var(--muted); font-size:.66rem; border-radius:99px; padding:1px 7px; }
      .rv-day-title { margin-top:26px; }
      @keyframes pop { 0% { transform:scale(1); } 45% { transform:scale(1.35); } 100% { transform:scale(1); } }
      @keyframes burst { 0% { transform:scale(.4); opacity:.75; } 100% { transform:scale(2.6); opacity:0; } }
      @keyframes glow { 0% { background:rgba(95,217,154,.28); } 100% { background:transparent; } }
      .sched-habit.celebrate { animation:glow .9s ease-out; border-radius:8px; }
      .sched-habit.celebrate .sched-check,
      .sched-habit.celebrate .etat-fait { animation:pop .45s ease-out; }
      .burst { position:absolute; inset:-4px; border-radius:50%; border:2px solid var(--accent); animation:burst .6s ease-out forwards; pointer-events:none; }
      .sched-check { position:relative; }
      .now-tag { margin-left:8px; padding:1px 8px; border-radius:99px; background:var(--accent); color:var(--bg); font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; vertical-align:middle; }
      .sched-chevron { flex:none; color:var(--muted); font-size:.8rem; padding-left:6px; }
      .express-check { flex:none; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
      .sched-group.is-done-express { opacity:.6; }
      .tap-shield { position:fixed; inset:0; z-index:9999; background:transparent; }
      .plan-block.dragging { opacity:.35; }
      .plan-preview { position:absolute; left:2px; right:2px; border:2px dashed var(--accent); border-radius:5px; background:rgba(95,217,154,.12); z-index:6; pointer-events:none; display:flex; align-items:flex-start; }
      .pb-time { font-size:.6rem; color:var(--accent); font-weight:700; padding:1px 4px; font-variant-numeric:tabular-nums; }
      .plan-block.is-now { outline:2px solid var(--accent); outline-offset:1px; z-index:4; }
      .plan-now { position:absolute; left:0; right:0; height:2px; background:#e5484d; z-index:5; pointer-events:none; }
      .plan-now::before { content:""; position:absolute; left:-3px; top:-3px; width:8px; height:8px; border-radius:50%; background:#e5484d; }
      .plan-block.selected { outline:2px solid #fff; outline-offset:1px; box-shadow:0 0 0 2px rgba(0,0,0,.4); z-index:3; }
      .pb-check { position:absolute; top:1px; right:3px; font-size:9px; font-weight:900; color:inherit; }
      .plan-selbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--accent-dim); border-radius:10px; padding:8px 12px; margin:4px 0 8px; font-size:.82rem; }
      .plan-selbar .selbar-hint { color:var(--muted); font-size:.76rem; flex:1; }
